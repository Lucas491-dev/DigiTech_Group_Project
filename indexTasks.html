<!DOCTYPE html>
<html lang="en">

<head>
    <title>Add Assessments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar is-primary" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
         
        </div>
        <div class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="indexTasks.html">Add Assessments</a>
                <a class="navbar-item" href="grades.html">Grades</a>
               
            </div>
        </div>
    </nav>

    <div class="columns">
        <div class="column has-background-info-light">
            <h1 class="title">Add Assessments</h1>

            <div id="taskInput">
                <div class="dropdown" id="subjectDropdown">
                    <div class="dropdown-trigger">
                        <button class="button" aria-haspopup="true" aria-controls="dropdown-menu">
                            <span id="selectedSubject">Select Subject</span>
                            <span class="icon is-small">
                                <i class="fas fa-angle-down" aria-hidden="true"></i>
                            </span>
                        </button>
                    </div>
                    <div class="dropdown-menu" id="dropdown-menu" role="menu">
                        <div class="dropdown-content" id="subjectList"></div>
                    </div>
                </div>

                <input type="text" id="taskName" class="input mt-3" placeholder="Input Assessment">
                <input type="date" id="taskDue" class="input mt-3" placeholder="Due Date">
                <input type="text" id="taskInfo" class="input mt-3" placeholder="Notes">
                <button class="button is-success" id="addTaskButton">Add</button>
            </div>
        </div>

        <div class="column">
            <table class="table" id="taskTable">
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Task</th>
                        <th>Due</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>


    <script src="scriptTasks.js"></script>
</body>

</html>
